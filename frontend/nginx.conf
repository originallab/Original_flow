# Servidor de archivos estáticos de la aplicación de una sola página (React Router).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Para el HEALTHCHECK de la imagen y de EasyPanel.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Los archivos compilados llevan su huella en el nombre (cambian cuando cambian): se guardan un año.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/nginx-headers.conf;
  }

  # Cualquier otra dirección es una pantalla de la aplicación (/login, /p/mi-pagina, /funnels/…): se sirve
  # index.html y el router decide. Un archivo que sí existe (favicon…) se sirve tal cual. index.html nunca
  # se guarda en caché, para que cada publicación nueva se vea al recargar.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/nginx-headers.conf;
  }
}
