# Encabezados de seguridad para toda respuesta (nginx no los hereda si una ubicación declara los suyos,
# por eso se incluyen en cada una). Falta definir una Content-Security-Policy: las páginas publicadas llevan
# estilos de la marca del cliente y hay que decidirla con calma antes de producción.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
